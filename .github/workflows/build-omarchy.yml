name: build-omarchy

# Linux-only builds for Omarchy / Arch. Two jobs:
#   portable   — ubuntu-22.04 (glibc 2.35): AppImage + deb + rpm that run
#                anywhere, Omarchy included. Attached to a draft release on tags.
#   arch-native — archlinux:latest container (current glibc): AppImage built
#                against the same rolling toolchain Omarchy ships, for users
#                who hit glibc/webkit skew with the portable one.
#
# Triggers: manual dispatch, or pushing an omarchy-v* / linux-v* tag
# (e.g. omarchy-v0.8.4) which drafts a GitHub release with the bundles.
on:
  workflow_dispatch:
  push:
    tags: ["omarchy-v*", "linux-v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Fetch Aether core
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Fetch hev-socks5-tunnel (Linux VPN tun2socks)
        run: bash src-tauri/binaries/fetch-hev.sh

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-omarchy-portable
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  arch-native:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg \
            openssl curl wget file git nodejs npm

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch Aether core
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Fetch hev-socks5-tunnel (Linux VPN tun2socks)
        run: bash src-tauri/binaries/fetch-hev.sh

      - name: Pre-seed linuxdeploy gtk plugin (Arch fixes)
        # Same two Arch breakages hit locally (see scripts/build-omarchy.sh):
        #  1. gdk-pixbuf2 ships no loader dir -> `cp: cannot stat ...` aborts
        #     the plugin (set -e). Guard the copy + cache-file sed.
        #  2. fresh cache lacks the loaders.cache parent dir -> mkdir it.
        # Pre-seed the patched plugin into the bundler cache; tauri reuses
        # cached files instead of downloading a fresh (unpatched) copy.
        run: |
          mkdir -p ~/.cache/tauri
          curl -sSL --max-time 120 -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          python3 - <<'EOF'
          import os
          p = os.path.expanduser("~/.cache/tauri/linuxdeploy-plugin-gtk.sh")
          src = open(p).read()
          src = src.replace(
              'copy_tree "$gdk_pixbuf_binarydir" "$APPDIR/"',
              'if [ -e "$gdk_pixbuf_binarydir" ]; then\n'
              '    copy_tree "$gdk_pixbuf_binarydir" "$APPDIR/"\n'
              'else\n'
              '    echo "WARNING: $gdk_pixbuf_binarydir not found, skipping pixbuf loader copy"\n'
              'fi',
          ).replace(
              'sed -i "s|$gdk_pixbuf_moduledir/||g" "$APPDIR/$gdk_pixbuf_cache_file"',
              'if [ -f "$APPDIR/$gdk_pixbuf_cache_file" ]; then\n'
              '    sed -i "s|$gdk_pixbuf_moduledir/||g" "$APPDIR/$gdk_pixbuf_cache_file"\n'
              'fi',
          ).replace(
              'echo "Updating pixbuf cache in $APPDIR/$gdk_pixbuf_cache_file"\n',
              'echo "Updating pixbuf cache in $APPDIR/$gdk_pixbuf_cache_file"\n'
              '    mkdir -p "$(dirname "$APPDIR/$gdk_pixbuf_cache_file")"\n',
              1,
          )
          open(p, "w").write(src)
          print("pre-seeded patched gtk plugin")
          EOF

      - name: Build frontend + AppImage
        env:
          # Arch libs use RELR relocations the linuxdeploy-bundled `strip`
          # cannot parse — skip stripping (same as scripts/build-omarchy.sh).
          NO_STRIP: "1"
        run: |
          npm ci
          npm run build
          # -v: tauri swallows all linuxdeploy output at the default log
          # level ("failed to run linuxdeploy" with no detail); verbose
          # mode prints the plugin output so failures are diagnosable.
          npx tauri build -v --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-omarchy-arch-native
          path: src-tauri/target/release/bundle/appimage/*.AppImage
