name: build-omarchy

# Linux-only builds for Omarchy / Arch. Two jobs:
#   portable   — ubuntu-22.04 (glibc 2.35): AppImage + deb + rpm that run
#                anywhere, Omarchy included. Attached to a draft release on tags.
#   arch-native — archlinux:latest container (current glibc): AppImage built
#                against the same rolling toolchain Omarchy ships, for users
#                who hit glibc/webkit skew with the portable one.
#
# Triggers: manual dispatch, or pushing an omarchy-v* / linux-v* tag
# (e.g. omarchy-v0.8.4) which drafts a GitHub release with the bundles.
on:
  workflow_dispatch:
  push:
    tags: ["omarchy-v*", "linux-v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Fetch Aether core
        run: bash src-tauri/binaries/fetch-aether.sh

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-omarchy-portable
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  arch-native:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg \
            openssl curl wget file git nodejs npm

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch Aether core
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Build frontend + AppImage
        run: |
          npm ci
          npm run build
          npx tauri build --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-omarchy-arch-native
          path: src-tauri/target/release/bundle/appimage/*.AppImage
